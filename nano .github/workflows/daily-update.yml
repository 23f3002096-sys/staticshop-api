name: Daily Update by 23F3002096@ds.study.iitm.ac.in

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Update by 23F3002096@ds.study.iitm.ac.in
      run: echo "Updated: $(date)" > status.txt
    
    - run: |
        git config user.name "23F3002096 Bot"
        git config user.email "23f3002096@ds.study.iitm.ac.in"
        git add status.txt
        git commit -m "Daily update $(date)"
        git push
